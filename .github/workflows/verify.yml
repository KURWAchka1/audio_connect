name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify wire protocol, authentication, and bounded shutdown
        run: dotnet run --project desktop/AudioConnect.Tests -c Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify DSP, protocol parsing, minimum API compatibility, and APK packaging
        working-directory: android
        run: bash gradlew testDebugUnitTest lintRelease assembleDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-release.html
